<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Poćwicz zegar</title>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <h1 class="masthead__title">Poćwicz zegar</h1>
      <p class="masthead__step">co 5 minut</p>
    </header>

    <div class="task-head">
      <p id="mode-label" class="mode-label">TRYB 1 z 2 · ODCZYTAJ</p>
      <p id="prompt" class="prompt">Którą godzinę pokazuje zegar?</p>
      <p id="target" class="target" hidden>
        Ustaw godzinę <strong id="target-time">00:00</strong>
      </p>
    </div>

    <div class="clock-wrap">
      <svg id="clock" class="clock" viewBox="0 0 320 320" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-labelledby="clock-title clock-description">
        <title id="clock-title">Zegar analogowy</title>
        <desc id="clock-description">Krótka wskazówka pokazuje godzinę, a długa minuty.</desc>
        <circle class="clock__face" cx="160" cy="160" r="145"></circle>

        <defs>
          <g id="minute-interval">
            <line class="clock__tick" x1="160" y1="17" x2="160" y2="25" transform="rotate(6 160 160)"></line>
            <line class="clock__tick" x1="160" y1="17" x2="160" y2="25" transform="rotate(12 160 160)"></line>
            <line class="clock__tick" x1="160" y1="17" x2="160" y2="25" transform="rotate(18 160 160)"></line>
            <line class="clock__tick" x1="160" y1="17" x2="160" y2="25" transform="rotate(24 160 160)"></line>
          </g>
        </defs>

        <g aria-hidden="true">
          <use xlink:href="#minute-interval"></use>
          <use xlink:href="#minute-interval" transform="rotate(30 160 160)"></use>
          <use xlink:href="#minute-interval" transform="rotate(60 160 160)"></use>
          <use xlink:href="#minute-interval" transform="rotate(90 160 160)"></use>
          <use xlink:href="#minute-interval" transform="rotate(120 160 160)"></use>
          <use xlink:href="#minute-interval" transform="rotate(150 160 160)"></use>
          <use xlink:href="#minute-interval" transform="rotate(180 160 160)"></use>
          <use xlink:href="#minute-interval" transform="rotate(210 160 160)"></use>
          <use xlink:href="#minute-interval" transform="rotate(240 160 160)"></use>
          <use xlink:href="#minute-interval" transform="rotate(270 160 160)"></use>
          <use xlink:href="#minute-interval" transform="rotate(300 160 160)"></use>
          <use xlink:href="#minute-interval" transform="rotate(330 160 160)"></use>
          <line class="clock__tick clock__tick--hour" x1="160" y1="17" x2="160" y2="29"></line>
          <line class="clock__tick clock__tick--hour" x1="160" y1="17" x2="160" y2="29" transform="rotate(30 160 160)"></line>
          <line class="clock__tick clock__tick--hour" x1="160" y1="17" x2="160" y2="29" transform="rotate(60 160 160)"></line>
          <line class="clock__tick clock__tick--hour" x1="160" y1="17" x2="160" y2="29" transform="rotate(90 160 160)"></line>
          <line class="clock__tick clock__tick--hour" x1="160" y1="17" x2="160" y2="29" transform="rotate(120 160 160)"></line>
          <line class="clock__tick clock__tick--hour" x1="160" y1="17" x2="160" y2="29" transform="rotate(150 160 160)"></line>
          <line class="clock__tick clock__tick--hour" x1="160" y1="17" x2="160" y2="29" transform="rotate(180 160 160)"></line>
          <line class="clock__tick clock__tick--hour" x1="160" y1="17" x2="160" y2="29" transform="rotate(210 160 160)"></line>
          <line class="clock__tick clock__tick--hour" x1="160" y1="17" x2="160" y2="29" transform="rotate(240 160 160)"></line>
          <line class="clock__tick clock__tick--hour" x1="160" y1="17" x2="160" y2="29" transform="rotate(270 160 160)"></line>
          <line class="clock__tick clock__tick--hour" x1="160" y1="17" x2="160" y2="29" transform="rotate(300 160 160)"></line>
          <line class="clock__tick clock__tick--hour" x1="160" y1="17" x2="160" y2="29" transform="rotate(330 160 160)"></line>
        </g>

        <g aria-hidden="true">
          <text class="clock__number" x="160" y="48">12</text>
          <text class="clock__number" x="216" y="64">1</text>
          <text class="clock__number" x="256" y="104">2</text>
          <text class="clock__number" x="272" y="160">3</text>
          <text class="clock__number" x="256" y="216">4</text>
          <text class="clock__number" x="216" y="256">5</text>
          <text class="clock__number" x="160" y="272">6</text>
          <text class="clock__number" x="104" y="256">7</text>
          <text class="clock__number" x="64" y="216">8</text>
          <text class="clock__number" x="48" y="160">9</text>
          <text class="clock__number" x="64" y="104">10</text>
          <text class="clock__number" x="104" y="64">11</text>

          <text class="clock__minute-label" x="160" y="48">00</text>
          <text class="clock__minute-label" x="216" y="64">05</text>
          <text class="clock__minute-label" x="256" y="104">10</text>
          <text class="clock__minute-label" x="272" y="160">15</text>
          <text class="clock__minute-label" x="256" y="216">20</text>
          <text class="clock__minute-label" x="216" y="256">25</text>
          <text class="clock__minute-label" x="160" y="272">30</text>
          <text class="clock__minute-label" x="104" y="256">35</text>
          <text class="clock__minute-label" x="64" y="216">40</text>
          <text class="clock__minute-label" x="48" y="160">45</text>
          <text class="clock__minute-label" x="64" y="104">50</text>
          <text class="clock__minute-label" x="104" y="64">55</text>
        </g>

        <line id="hour-hand" class="clock__hand clock__hand--hour" x1="160" y1="173" x2="160" y2="92"></line>
        <line id="minute-hand" class="clock__hand clock__hand--minute" x1="160" y1="178" x2="160" y2="52"></line>
        <circle class="clock__pin" cx="160" cy="160" r="8"></circle>
      </svg>
    </div>

    <div id="hint-row" class="hint-row">
      <button id="hint" class="hint-button" type="button" aria-pressed="false">Pokaż minuty</button>
    </div>

    <fieldset id="answers" class="answers">
      <legend class="answers__legend">Wybierz godzinę</legend>
      <button class="answer" type="button">00:00</button>
      <button class="answer" type="button">00:00</button>
      <button class="answer" type="button">00:00</button>
    </fieldset>

    <section id="controls" class="controls" aria-label="Ustawianie wskazówek" hidden>
      <div class="control control--hours">
        <p class="control__label">GODZINY</p>
        <div class="control__buttons">
          <button class="adjust" type="button" data-unit="hour" data-direction="-1" aria-label="Cofnij wskazówkę godzinową">−</button>
          <output id="hour-value" class="control__value" aria-live="polite">12</output>
          <button class="adjust" type="button" data-unit="hour" data-direction="1" aria-label="Przesuń wskazówkę godzinową">+</button>
        </div>
      </div>
      <div class="control control--minutes">
        <p class="control__label">MINUTY</p>
        <div class="control__buttons">
          <button class="adjust" type="button" data-unit="minute" data-direction="-1" aria-label="Cofnij wskazówkę minutową o 5 minut">−</button>
          <output id="minute-value" class="control__value" aria-live="polite">00</output>
          <button class="adjust" type="button" data-unit="minute" data-direction="1" aria-label="Przesuń wskazówkę minutową o 5 minut">+</button>
        </div>
      </div>
    </section>

    <button id="check" class="check" type="button" hidden>Sprawdź</button>

    <p id="feedback" class="feedback" aria-live="polite"></p>
    <button id="next" class="next" type="button" hidden>Ustaw wskazówki</button>

    <noscript><p class="noscript">Ta strona potrzebuje włączonego JavaScriptu, aby losować zadania.</p></noscript>
  </main>
  <script src="assets/clock.js"></script>
</body>
</html>
